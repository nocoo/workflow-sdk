name: Quality Slots

on:
  workflow_call:
    outputs:
      tested-sha:
        description: Commit SHA verified by quality gate
        value: ${{ jobs.z1-gate.outputs.tested-sha }}

permissions:
  contents: read

jobs:
  s1-types:
    name: "S1: Types"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: bun
      - run: bun run typecheck
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s2-lint:
    name: "S2: Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: bun
      - run: bun run lint
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s3-workflow:
    name: "S3: Workflow"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/lint-workflows@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g1-secrets:
    name: "G1: Secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: nocoo/base-ci/.github/actions/scan-secrets@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g2-dependencies:
    name: "G2: Dependencies"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/scan-dependencies@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          lockfiles: "bun.lock"
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  b1-build:
    name: "B1: Build"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: bun
      - run: bun run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b1-dist
          path: dist
          if-no-files-found: error
          retention-days: 1
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l1-unit:
    name: "L1: Unit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: bun
      - run: bun run test:coverage
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l2-runtime:
    name: "L2: Runtime"
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_L2 == 'true' }}
    steps:
      - run: echo "N/A - no platform runtime bindings"

  l3-integration:
    name: "L3: Integration"
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_L3 == 'true' }}
    steps:
      - run: echo "N/A - duplicate of L1 unit/integration vitest suite"

  l4-e2e:
    name: "L4: E2E"
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_L4 == 'true' }}
    steps:
      - run: echo "Manual E2E via local Magpie gateway"

  p1-package:
    name: "P1: Package"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [b1-build]
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: bun
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: b1-dist
          path: dist
      - run: |
          PKG="$(npm pack --ignore-scripts | tail -n 1)"
          mkdir -p /tmp/pkg-smoke && cd /tmp/pkg-smoke
          npm init -y >/dev/null
          npm install --ignore-scripts "$GITHUB_WORKSPACE/$PKG"
          node --input-type=module -e 'import * as sdk from "@nocoo/workflow-sdk"; if (!sdk.Agent || !sdk.LocalOpenAIAgentConfig) process.exit(1);'
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  z1-gate:
    name: "Z1: Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - s1-types
      - s2-lint
      - s3-workflow
      - g1-secrets
      - g2-dependencies
      - b1-build
      - l1-unit
      - l2-runtime
      - l3-integration
      - l4-e2e
      - p1-package
    outputs:
      tested-sha: ${{ steps.gate.outputs.tested-sha }}
    steps:
      - name: Verify quality slots
        id: gate
        uses: nocoo/base-ci/.github/actions/z1-gate@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          needs-json: ${{ toJSON(needs) }}
          expected-sha: ${{ github.sha }}
          required-jobs: |
            s1-types=S1: Types
            s2-lint=S2: Lint
            s3-workflow=S3: Workflow
            g1-secrets=G1: Secrets
            g2-dependencies=G2: Dependencies
            b1-build=B1: Build
            l1-unit=L1: Unit
            p1-package=P1: Package
          skipped-jobs: |
            l2-runtime=L2: Runtime
            l3-integration=L3: Integration
            l4-e2e=L4: E2E
